    // --- ACTIVE TABLE VIEW (TABLE, CARD, KANBAN) ---
    function ActiveTableView({
      table,
      viewMode,
      setViewMode,
      tableSearch,
      setTableSearch,
      selectedRowIds,
      setSelectedRowIds,
      onAddRecord,
      onEditRecord,
      onDetailRecord,
      onDeleteRecord,
      onBulkDelete,
      onEditSchema,
      onDeleteTable
    }) {
      const [sortCol, setSortCol] = useState(null);
      const [sortDir, setSortDir] = useState('asc');
      const [kanbanColId, setKanbanColId] = useState(() => {
        const selectCol = table.columns.find(c => c.type === 'Status' || c.type === 'Pilihan');
        return selectCol ? selectCol.id : table.columns[0]?.id;
      });

      // Update kanban default field if column deleted
      useEffect(() => {
        const selectCol = table.columns.find(c => c.type === 'Status' || c.type === 'Pilihan');
        setKanbanColId(selectCol ? selectCol.id : table.columns[0]?.id);
      }, [table]);

      // Filtered & Sorted Rows
      const filteredRows = useMemo(() => {
        return table.rows.filter(row => {
          if (!tableSearch) return true;
          return Object.values(row).some(val => 
            String(val).toLowerCase().includes(tableSearch.toLowerCase())
          );
        }).sort((a, b) => {
          if (!sortCol) return 0;
          const valA = a[sortCol] ?? '';
          const valB = b[sortCol] ?? '';
          if (valA < valB) return sortDir === 'asc' ? -1 : 1;
          if (valA > valB) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }, [table.rows, tableSearch, sortCol, sortDir]);

      const handleSort = (colId) => {
        if (sortCol === colId) {
          setSortDir(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortCol(colId);
          setSortDir('asc');
        }
      };

      const toggleSelectAll = () => {
        if (selectedRowIds.length === filteredRows.length) {
          setSelectedRowIds([]);
        } else {
          setSelectedRowIds(filteredRows.map(r => r.id));
        }
      };

      const toggleSelectRow = (id) => {
        setSelectedRowIds(prev => 
          prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
        );
      };

      return (
        <div className="flex-1 flex flex-col h-full overflow-hidden">
          {/* TABLE TOP BAR */}
          <div className="p-4 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700/80 flex flex-col md:flex-row md:items-center justify-between gap-4 shrink-0">
            {/* Title & Info */}
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-300 flex items-center justify-center text-lg">
                <i className={`fa-solid ${table.icon || 'fa-table'}`}></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-bold text-lg text-slate-900 dark:text-white">{table.name}</h1>
                  <button 
                    onClick={onEditSchema}
                    className="text-xs text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 px-1.5 py-0.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700"
                    title="Pengaturan Skema Kolom"
                  >
                    <i className="fa-solid fa-gear mr-1"></i> Edit Skema
                  </button>
                  <button 
                    onClick={onDeleteTable}
                    className="text-xs text-rose-400 hover:text-rose-600 px-1.5 py-0.5 rounded hover:bg-rose-50 dark:hover:bg-rose-950/40"
                    title="Hapus Tabel Ini"
                  >
                    <i className="fa-solid fa-trash"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400">{table.description || 'Kelola entry data Anda secara visual.'}</p>
              </div>
            </div>

            {/* View Switchers & Primary Action */}
            <div className="flex flex-wrap items-center gap-2.5">
              {/* View Switcher */}
              <div className="flex items-center bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl border border-slate-200 dark:border-slate-600">
                <button
                  onClick={() => setViewMode('table')}
                  className={`px-2.5 py-1 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition ${
                    viewMode === 'table' ? 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-300 shadow-xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  <i className="fa-solid fa-table-cells"></i> Tabel
                </button>
                <button
                  onClick={() => setViewMode('card')}
                  className={`px-2.5 py-1 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition ${
                    viewMode === 'card' ? 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-300 shadow-xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  <i className="fa-solid fa-border-all"></i> Kartu
                </button>
                <button
                  onClick={() => setViewMode('kanban')}
                  className={`px-2.5 py-1 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition ${
                    viewMode === 'kanban' ? 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-300 shadow-xs' : 'text-slate-500 dark:text-slate-400'
                  }`}
                >
                  <i className="fa-solid fa-[#fa-bars-staggered] fa-bars-staggered"></i> Kanban
                </button>
              </div>

              {/* Add Record */}
              <button
                onClick={onAddRecord}
                className="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm"
              >
                <i className="fa-solid fa-plus"></i>
                <span>Tambah Entry Data</span>
              </button>
            </div>
          </div>

          {/* TABLE CONTROLS BAR (Search & Bulk Delete) */}
          <div className="px-4 py-2.5 bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-200 dark:border-slate-700/60 flex items-center justify-between gap-3 text-xs shrink-0">
            <div className="flex items-center gap-2 flex-1 max-w-md">
              <div className="relative w-full">
                <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
                <input
                  type="text"
                  value={tableSearch}
                  onChange={(e) => setTableSearch(e.target.value)}
                  placeholder={`Cari data di ${table.name}...`}
                  className="w-full pl-8 pr-3 py-1.5 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>
            </div>

            <div className="flex items-center gap-3">
              {selectedRowIds.length > 0 && (
                <button
                  onClick={onBulkDelete}
                  className="bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-300 border border-rose-200 dark:border-rose-800 px-3 py-1.5 rounded-lg font-semibold hover:bg-rose-100 transition flex items-center gap-1.5"
                >
                  <i className="fa-solid fa-trash-can"></i>
                  <span>Hapus ({selectedRowIds.length})</span>
                </button>
              )}
              <span className="text-slate-500 dark:text-slate-400 font-medium">
                Total: <strong className="text-slate-800 dark:text-slate-200">{filteredRows.length}</strong>
              </span>
            </div>
          </div>

          {/* VIEW RENDERER */}
          <div className="flex-1 overflow-auto p-4">
            
            {/* 1. TABLE VIEW MODE */}
            {viewMode === 'table' && (
              <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xs overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider">
                      <tr>
                        <th className="p-3 w-10 text-center">
                          <input
                            type="checkbox"
                            checked={filteredRows.length > 0 && selectedRowIds.length === filteredRows.length}
                            onChange={toggleSelectAll}
                            className="rounded text-brand-600 focus:ring-brand-500"
                          />
                        </th>
                        {table.columns.map(col => (
                          <th 
                            key={col.id} 
                            onClick={() => handleSort(col.id)}
                            className="p-3 cursor-pointer hover:text-slate-800 dark:hover:text-slate-200 transition select-none"
                          >
                            <div className="flex items-center gap-1.5">
                              <span>{col.label}</span>
                              {sortCol === col.id ? (
                                <i className={`fa-solid fa-arrow-${sortDir === 'asc' ? 'up' : 'down'} text-brand-600`}></i>
                              ) : (
                                <i className="fa-solid fa-sort text-slate-300 dark:text-slate-600"></i>
                              )}
                            </div>
                          </th>
                        ))}
                        <th className="p-3 w-24 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700/60">
                      {filteredRows.length === 0 ? (
                        <tr>
                          <td colSpan={table.columns.length + 2} className="p-8 text-center text-slate-400">
                            <i className="fa-solid fa-folder-open text-3xl mb-2 text-slate-300 dark:text-slate-600"></i>
                            <p>Tidak ada data ditemukan.</p>
                          </td>
                        </tr>
                      ) : (
                        filteredRows.map(row => (
                          <tr key={row.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-700/30 transition">
                            <td className="p-3 text-center">
                              <input
                                type="checkbox"
                                checked={selectedRowIds.includes(row.id)}
                                onChange={() => toggleSelectRow(row.id)}
                                className="rounded text-brand-600 focus:ring-brand-500"
                              />
                            </td>
                            {table.columns.map(col => (
                              <td key={col.id} className="p-3 text-slate-700 dark:text-slate-200">
                                <CellRenderer col={col} value={row[col.id]} row={row} />
                              </td>
                            ))}
                            <td className="p-3 text-center">
                              <div className="flex items-center justify-center gap-1">
                                <button
                                  onClick={() => onDetailRecord(row)}
                                  className="p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 hover:text-brand-600"
                                  title="Lihat Detail"
                                >
                                  <i className="fa-solid fa-eye"></i>
                                </button>
                                <button
                                  onClick={() => onEditRecord(row)}
                                  className="p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 hover:text-indigo-600"
                                  title="Edit Entry"
                                >
                                  <i className="fa-solid fa-pen"></i>
                                </button>
                                <button
                                  onClick={() => onDeleteRecord(row.id)}
                                  className="p-1.5 rounded hover:bg-rose-50 dark:hover:bg-rose-950/40 text-slate-400 hover:text-rose-600"
                                  title="Hapus"
                                >
                                  <i className="fa-solid fa-trash-can"></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 2. CARD VIEW MODE */}
            {viewMode === 'card' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {filteredRows.length === 0 ? (
                  <div className="col-span-full p-12 text-center text-slate-400">
                    <p>Tidak ada data ditemukan.</p>
                  </div>
                ) : (
                  filteredRows.map(row => {
                    // Find image column if any
                    const imgCol = table.columns.find(c => c.type === 'URL Gambar');
                    const titleCol = table.columns[0];

                    return (
                      <div key={row.id} className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xs p-4 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                          {imgCol && row[imgCol.id] && (
                            <img 
                              src={row[imgCol.id]} 
                              alt="Thumbnail" 
                              className="w-full h-32 object-cover rounded-xl mb-3 bg-slate-100 dark:bg-slate-700" 
                              onError={(e) => { e.target.src = 'https://placehold.co/300x150/e2e8f0/64748b?text=No+Image'; }}
                            />
                          )}

                          <div className="flex items-start justify-between gap-2 mb-3">
                            <h3 className="font-bold text-slate-900 dark:text-white text-sm line-clamp-1">
                              {row[titleCol?.id] || 'Tanpa Judul'}
                            </h3>
                          </div>

                          <div className="space-y-2 text-xs">
                            {table.columns.slice(1, 5).map(col => (
                              <div key={col.id} className="flex justify-between items-center gap-2 border-b border-slate-50 dark:border-slate-700/40 pb-1.5">
                                <span className="text-slate-400 shrink-0">{col.label}:</span>
                                <span className="font-medium text-slate-700 dark:text-slate-200 truncate">
                                  <CellRenderer col={col} value={row[col.id]} row={row} />
                                </span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-xs">
                          <button onClick={() => onDetailRecord(row)} className="text-brand-600 dark:text-brand-400 font-semibold hover:underline">
                            Detail Data
                          </button>
                          <div className="flex items-center gap-1">
                            <button onClick={() => onEditRecord(row)} className="p-1 rounded text-slate-400 hover:text-brand-600">
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button onClick={() => onDeleteRecord(row.id)} className="p-1 rounded text-slate-400 hover:text-rose-600">
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* 3. KANBAN BOARD MODE */}
            {viewMode === 'kanban' && (
              <div className="space-y-4">
                {/* Select Grouping Column */}
                <div className="flex items-center gap-2 text-xs">
                  <span className="text-slate-500 font-medium">Grup berdasarkan kolom:</span>
                  <select
                    value={kanbanColId}
                    onChange={(e) => setKanbanColId(e.target.value)}
                    className="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-semibold"
                  >
                    {table.columns.map(c => (
                      <option key={c.id} value={c.id}>{c.label} ({c.type})</option>
                    ))}
                  </select>
                </div>

                <KanbanBoard 
                  table={table}
                  groupColId={kanbanColId}
                  filteredRows={filteredRows}
                  onEditRecord={onEditRecord}
                  onDetailRecord={onDetailRecord}
                />
              </div>
            )}

          </div>
        </div>
      );
    }

    // --- CELL RENDERER FOR DYNAMIC DATA TYPES ---
    function CellRenderer({ col, value, row }) {
      if (value === undefined || value === null || value === '') {
        return <span className="text-slate-300 dark:text-slate-600 font-normal">-</span>;
      }

      switch (col.type) {
        case 'Status':
        case 'Pilihan':
          return (
            <span className={`inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${getBadgeStyle(value)}`}>
              {value}
            </span>
          );
        case 'Angka':
          if (col.label.toLowerCase().includes('harga') || col.label.toLowerCase().includes('rp')) {
            return <span className="font-semibold">{Number(value).toLocaleString('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 })}</span>;
          }
          return <span className="font-semibold">{Number(value).toLocaleString('id-ID')}</span>;
        case 'Checklist':
          return (
            <span className={`inline-flex items-center gap-1 font-semibold ${value ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}`}>
              <i className={`fa-solid ${value ? 'fa-circle-check text-base' : 'fa-circle-xmark text-base'}`}></i>
              {value ? 'Ya' : 'Tidak'}
            </span>
          );
        case 'URL Gambar':
          return (
            <img 
              src={value} 
              alt="Thumbnail" 
              className="w-8 h-8 rounded-lg object-cover border border-slate-200 dark:border-slate-700 bg-slate-100" 
              onError={(e) => { e.target.src = 'https://placehold.co/100x100/e2e8f0/64748b?text=Err'; }}
            />
          );
        case 'Email':
          return (
            <a href={`mailto:${value}`} className="text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1">
              <i className="fa-regular fa-envelope text-[10px]"></i> {value}
            </a>
          );
        case 'Telepon':
          return (
            <a href={`tel:${value}`} className="text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
              <i className="fa-solid fa-phone text-[10px]"></i> {value}
            </a>
          );
        case 'Tanggal':
          return (
            <span className="flex items-center gap-1 text-slate-600 dark:text-slate-300">
              <i className="fa-regular fa-calendar text-[10px] text-slate-400"></i> {value}
            </span>
          );
        default:
          return <span>{String(value)}</span>;
      }
    }

    // --- KANBAN BOARD COMPONENT ---
    function KanbanBoard({ table, groupColId, filteredRows, onEditRecord, onDetailRecord }) {
      const groupCol = table.columns.find(c => c.id === groupColId);
      
      // Determine unique values/columns for kanban
      const columnsList = useMemo(() => {
        if (groupCol && groupCol.options && groupCol.options.length > 0) {
          return groupCol.options;
        }
        const set = new Set(filteredRows.map(r => String(r[groupColId] || 'Lainnya')));
        return Array.from(set);
      }, [groupCol, filteredRows, groupColId]);

      return (
        <div className="flex gap-4 overflow-x-auto pb-4 items-start">
          {columnsList.map(colName => {
            const items = filteredRows.filter(r => String(r[groupColId] || 'Lainnya') === colName);
            const titleCol = table.columns[0];

            return (
              <div key={colName} className="w-72 shrink-0 bg-slate-100 dark:bg-slate-800/80 rounded-2xl p-3 border border-slate-200 dark:border-slate-700/80 flex flex-col max-h-[calc(100vh-250px)]">
                {/* Kanban Column Header */}
                <div className="flex items-center justify-between mb-3 px-1">
                  <div className="flex items-center gap-2">
                    <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${getBadgeStyle(colName)}`}>
                      {colName}
                    </span>
                  </div>
                  <span className="text-xs font-semibold text-slate-400">{items.length}</span>
                </div>

                {/* Cards Container */}
                <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
                  {items.length === 0 ? (
                    <div className="p-4 text-center text-xs text-slate-400 border border-dashed border-slate-200 dark:border-slate-700 rounded-xl">
                      Kosong
                    </div>
                  ) : (
                    items.map(item => (
                      <div 
                        key={item.id} 
                        onClick={() => onDetailRecord(item)}
                        className="bg-white dark:bg-slate-700/90 p-3.5 rounded-xl border border-slate-200 dark:border-slate-600 shadow-2xs hover:shadow-md hover:border-brand-500 cursor-pointer transition space-y-2"
                      >
                        <h4 className="font-bold text-xs text-slate-900 dark:text-white">
                          {item[titleCol?.id] || 'Tanpa Judul'}
                        </h4>

                        <div className="space-y-1 text-[11px] text-slate-500 dark:text-slate-300">
                          {table.columns.slice(1, 4).filter(c => c.id !== groupColId).map(c => (
                            <div key={c.id} className="truncate">
                              <span className="text-slate-400">{c.label}:</span> <CellRenderer col={c} value={item[c.id]} row={item} />
                            </div>
                          ))}
                        </div>

                        <div className="pt-2 border-t border-slate-100 dark:border-slate-600/60 flex items-center justify-end gap-1">
                          <button 
                            onClick={(e) => { e.stopPropagation(); onEditRecord(item); }}
                            className="p-1 text-slate-400 hover:text-brand-600 text-xs"
                          >
                            <i className="fa-solid fa-pen"></i>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // --- ANALYTICS & VISUALIZATIONS VIEW ---
    function AnalyticsView({ tables, activeTableId, setActiveTableId }) {
      const activeTable = tables.find(t => t.id === activeTableId) || tables[0];
      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);
      const instance1 = useRef(null);
      const instance2 = useRef(null);

      // Aggregate Numerical Fields
      const numericStats = useMemo(() => {
        if (!activeTable) return [];
        const numCols = activeTable.columns.filter(c => c.type === 'Angka');
        return numCols.map(col => {
          const vals = activeTable.rows.map(r => Number(r[col.id]) || 0);
          const total = vals.reduce((a, b) => a + b, 0);
          const avg = vals.length ? (total / vals.length) : 0;
          return { label: col.label, total, avg, max: Math.max(...vals, 0), min: Math.min(...vals, 0) };
        });
      }, [activeTable]);

      // Render Charts with Chart.js
      useEffect(() => {
        if (!activeTable) return;

        // Chart 1: Categorical Distribution
        const statusCol = activeTable.columns.find(c => c.type === 'Status' || c.type === 'Pilihan') || activeTable.columns[0];
        if (chartRef1.current && statusCol) {
          if (instance1.current) instance1.current.destroy();

          const counts = {};
          activeTable.rows.forEach(r => {
            const k = String(r[statusCol.id] || 'Belum diisi');
            counts[k] = (counts[k] || 0) + 1;
          });

          const ctx1 = chartRef1.current.getContext('2d');
          instance1.current = new Chart(ctx1, {
            type: 'doughnut',
            data: {
              labels: Object.keys(counts),
              datasets: [{
                data: Object.values(counts),
                backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'],
                borderWidth: 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom' }
              }
            }
          });
        }

        // Chart 2: Records Overview across All Tables
        if (chartRef2.current) {
          if (instance2.current) instance2.current.destroy();

          const ctx2 = chartRef2.current.getContext('2d');
          instance2.current = new Chart(ctx2, {
            type: 'bar',
            data: {
              labels: tables.map(t => t.name),
              datasets: [{
                label: 'Jumlah Baris Data',
                data: tables.map(t => t.rows.length),
                backgroundColor: '#4f46e5',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }
              },
              scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
              }
            }
          });
        }

        return () => {
          if (instance1.current) instance1.current.destroy();
          if (instance2.current) instance2.current.destroy();
        };
      }, [activeTable, tables]);

      return (
        <div className="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto w-full">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <i className="fa-solid fa-chart-pie text-emerald-500"></i>
                Visualisasi Data & Analytics
              </h1>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Analisis otomatis grafik distribusi dan statistik agregat nilai numerik.
              </p>
            </div>

            {/* Target Table Selector */}
            <div className="flex items-center gap-2 bg-white dark:bg-slate-800 p-2 rounded-xl border border-slate-200 dark:border-slate-700 shadow-xs">
              <span className="text-xs font-semibold text-slate-500">Pilih Tabel:</span>
              <select
                value={activeTableId}
                onChange={(e) => setActiveTableId(e.target.value)}
                className="bg-transparent font-bold text-xs text-slate-800 dark:text-slate-100 focus:outline-none"
              >
                {tables.map(t => (
                  <option key={t.id} value={t.id}>{t.name}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Numeric Aggregations */}
          {numericStats.length > 0 && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {numericStats.map((stat, idx) => (
                <div key={idx} className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xs space-y-2">
                  <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{stat.label}</p>
                  <h3 className="text-2xl font-bold text-slate-900 dark:text-white">
                    {stat.total.toLocaleString('id-ID')}
                  </h3>
                  <div className="flex justify-between text-xs text-slate-500 pt-2 border-t border-slate-100 dark:border-slate-700">
                    <span>Rata-rata: <strong>{Math.round(stat.avg).toLocaleString('id-ID')}</strong></span>
                    <span>Max: <strong>{stat.max.toLocaleString('id-ID')}</strong></span>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Charts Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Chart 1 */}
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xs flex flex-col">
              <h3 className="font-bold text-sm text-slate-800 dark:text-white mb-4">
                Distribusi Kategori / Status ({activeTable?.name})
              </h3>
              <div className="relative h-64 w-full flex-1">
                <canvas ref={chartRef1}></canvas>
              </div>
            </div>

            {/* Chart 2 */}
            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xs flex flex-col">
              <h3 className="font-bold text-sm text-slate-800 dark:text-white mb-4">
                Perbandingan Volume Data per Tabel
              </h3>
              <div className="relative h-64 w-full flex-1">
                <canvas ref={chartRef2}></canvas>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- GLOBAL SEARCH RESULTS OVERLAY ---
    function GlobalSearchResults({ query, tables, onSelectRecord }) {
      const results = useMemo(() => {
        const q = query.toLowerCase();
        const matches = [];
        tables.forEach(table => {
          table.rows.forEach(row => {
            const hasMatch = Object.values(row).some(v => String(v).toLowerCase().includes(q));
            if (hasMatch) {
              matches.push({ table, row });
            }
          });
        });
        return matches;
      }, [query, tables]);

      return (
        <div className="p-6 max-w-5xl mx-auto w-full space-y-4">
          <h2 className="text-lg font-bold text-slate-900 dark:text-white">
            Hasil Pencarian Cepat untuk "{query}": <span className="text-brand-600">({results.length} ditemukan)</span>
          </h2>

          {results.length === 0 ? (
            <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 text-center text-slate-400">
              <p>Tidak ada data yang cocok di seluruh database Anda.</p>
            </div>
          ) : (
            <div className="space-y-3">
              {results.map(({ table, row }, idx) => (
                <div 
                  key={idx}
                  onClick={() => onSelectRecord(table.id, row)}
                  className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-500 cursor-pointer transition flex items-center justify-between"
                >
                  <div className="space-y-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-300 px-2 py-0.5 rounded-md">
                      Tabel: {table.name}
                    </span>
                    <h4 className="font-bold text-sm text-slate-800 dark:text-white">
                      {Object.values(row)[1] || 'Entry Record'}
                    </h4>
                    <p className="text-xs text-slate-500 line-clamp-1">
                      {Object.entries(row).filter(([k]) => k !== 'id').map(([k, v]) => `${k}: ${v}`).join(' | ')}
                    </p>
                  </div>
                  <i className="fa-solid fa-chevron-right text-slate-400"></i>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- SCHEMA BUILDER MODAL ---
    function SchemaModal({ table, onClose, onSave }) {
      const [name, setName] = useState(table ? table.name : '');
      const [description, setDescription] = useState(table ? table.description : '');
      const [icon, setIcon] = useState(table ? table.icon : 'fa-table');
      const [columns, setColumns] = useState(table ? table.columns : [
        { id: 'nama', label: 'Nama', type: 'Teks', required: true }
      ]);

      const handleAddColumn = () => {
        const id = 'col_' + Date.now();
        setColumns(prev => [...prev, { id, label: 'Kolom Baru', type: 'Teks', required: false, options: [] }]);
      };

      const handleColumnChange = (index, field, value) => {
        setColumns(prev => prev.map((col, i) => {
          if (i === index) {
            const updated = { ...col, [field]: value };
            if (field === 'label' && !table) {
              updated.id = value.toLowerCase().replace(/[^a-z0-0]/g, '_');
            }
            return updated;
          }
          return col;
        }));
      };

      const handleRemoveColumn = (index) => {
        if (columns.length <= 1) {
          alert('Tabel harus memiliki minimal 1 kolom!');
          return;
        }
        setColumns(prev => prev.filter((_, i) => i !== index));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert('Nama tabel wajib diisi!');
        onSave({
          id: table ? table.id : undefined,
          name,
          description,
          icon,
          columns
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-2xl my-8 overflow-hidden flex flex-col max-h-[90vh]">
            
            <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <i className="fa-solid fa-sliders text-brand-600"></i>
                {table ? 'Edit Skema Tabel' : 'Buat Tabel Baru'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-5 overflow-y-auto flex-1 text-xs">
              {/* Table Info */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="sm:col-span-2 space-y-1">
                  <label className="font-bold text-slate-700 dark:text-slate-300">Nama Tabel *</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Contoh: Modul Keuangan"
                    required
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600"
                  />
                </div>

                <div className="space-y-1">
                  <label className="font-bold text-slate-700 dark:text-slate-300">Ikon FontAwesome</label>
                  <input
                    type="text"
                    value={icon}
                    onChange={(e) => setIcon(e.target.value)}
                    placeholder="fa-table"
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600"
                  />
                </div>

                <div className="sm:col-span-3 space-y-1">
                  <label className="font-bold text-slate-700 dark:text-slate-300">Deskripsi Singkat</label>
                  <input
                    type="text"
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                    placeholder="Deskripsi fungsi database..."
                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600"
                  />
                </div>
              </div>

              {/* Dynamic Columns Builder */}
              <div className="space-y-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-slate-800 dark:text-white uppercase tracking-wider text-[11px]">
                    Definisi Kolom Skema
                  </span>
                  <button
                    type="button"
                    onClick={handleAddColumn}
                    className="text-brand-600 dark:text-brand-400 font-bold hover:underline"
                  >
                    + Tambah Kolom
                  </button>
                </div>

                <div className="space-y-3">
                  {columns.map((col, idx) => (
                    <div key={idx} className="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-600 space-y-2">
                      <div className="flex items-center gap-2">
                        <input
                          type="text"
                          value={col.label}
                          onChange={(e) => handleColumnChange(idx, 'label', e.target.value)}
                          placeholder="Label Kolom"
                          className="flex-1 px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600"
                        />

                        <select
                          value={col.type}
                          onChange={(e) => handleColumnChange(idx, 'type', e.target.value)}
                          className="px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 font-medium"
                        >
                          <option value="Teks">Teks</option>
                          <option value="Angka">Angka</option>
                          <option value="Tanggal">Tanggal</option>
                          <option value="Pilihan">Pilihan Dropdown</option>
                          <option value="Status">Status Badge</option>
                          <option value="Email">Email</option>
                          <option value="Telepon">Telepon</option>
                          <option value="Checklist">Checklist (Ya/Tidak)</option>
                          <option value="URL Gambar">URL Gambar</option>
                        </select>

                        <button
                          type="button"
                          onClick={() => handleRemoveColumn(idx)}
                          className="p-1.5 text-rose-500 hover:bg-rose-100 rounded-lg"
                        >
                          <i className="fa-solid fa-trash-can"></i>
                        </button>
                      </div>

                      {/* Options input if dropdown or status */}
                      {(col.type === 'Pilihan' || col.type === 'Status') && (
                        <div>
                          <input
                            type="text"
                            value={Array.isArray(col.options) ? col.options.join(', ') : (col.options || '')}
                            onChange={(e) => handleColumnChange(idx, 'options', e.target.value.split(',').map(s => s.trim()))}
                            placeholder="Opsi pilihan dipisahkan koma (e.g. Aktif, Pending, Nonaktif)"
                            className="w-full px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-[11px]"
                          />
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              {/* Submit Button */}
              <div className="pt-4 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-100 dark:hover:bg-slate-700"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md"
                >
                  Simpan Skema
                </button>
              </div>
            </form>

          </div>
        </div>
      );
    }

    // --- RECORD FORM MODAL (CREATE / EDIT DATA) ---
    function RecordModal({ table, record, onClose, onSave }) {
      const [formData, setFormData] = useState(() => {
        if (record) return { ...record };
        const init = {};
        table.columns.forEach(col => {
          if (col.type === 'Checklist') init[col.id] = false;
          else if (col.type === 'Status' || col.type === 'Pilihan') {
            init[col.id] = col.options?.[0] || '';
          } else init[col.id] = '';
        });
        return init;
      });

      const handleChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-xl my-8 overflow-hidden flex flex-col max-h-[90vh]">
            
            <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <i className="fa-solid fa-pen-to-square text-brand-600"></i>
                {record ? 'Edit Entry Data' : 'Tambah Entry Data Baru'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
              {table.columns.map(col => (
                <div key={col.id} className="space-y-1">
                  <label className="font-bold text-slate-700 dark:text-slate-300 flex items-center justify-between">
                    <span>{col.label} {col.required && <span className="text-rose-500">*</span>}</span>
                    <span className="text-[10px] font-normal text-slate-400">({col.type})</span>
                  </label>

                  {col.type === 'Pilihan' || col.type === 'Status' ? (
                    <select
                      value={formData[col.id] || ''}
                      onChange={(e) => handleChange(col.id, e.target.value)}
                      required={col.required}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-semibold"
                    >
                      {col.options?.map(opt => (
                        <option key={opt} value={opt}>{opt}</option>
                      ))}
                    </select>
                  ) : col.type === 'Checklist' ? (
                    <label className="flex items-center gap-2 cursor-pointer p-2 bg-slate-50 dark:bg-slate-700 rounded-xl border border-slate-200 dark:border-slate-600">
                      <input
                        type="checkbox"
                        checked={!!formData[col.id]}
                        onChange={(e) => handleChange(col.id, e.target.checked)}
                        className="rounded text-brand-600 focus:ring-brand-500"
                      />
                      <span className="font-medium text-slate-700 dark:text-slate-200">Ya, tandai dicentang</span>
                    </label>
                  ) : (
                    <input
                      type={col.type === 'Angka' ? 'number' : col.type === 'Tanggal' ? 'date' : col.type === 'Email' ? 'email' : 'text'}
                      value={formData[col.id] || ''}
                      onChange={(e) => handleChange(col.id, e.target.value)}
                      required={col.required}
                      placeholder={`Masukkan ${col.label.toLowerCase()}...`}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600"
                    />
                  )}
                </div>
              ))}

              <div className="pt-4 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-100 dark:hover:bg-slate-700"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md"
                >
                  Simpan Data
                </button>
              </div>
            </form>

          </div>
        </div>
      );
    }

    // --- RECORD DETAIL VIEW MODAL ---
    function RecordDetailModal({ table, record, onClose, onEdit, onDelete }) {
      const imgCol = table.columns.find(c => c.type === 'URL Gambar');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-lg my-8 overflow-hidden flex flex-col">
            
            <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <i className="fa-solid fa-circle-info text-brand-600"></i>
                Detail Entry Record
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="p-6 space-y-4 overflow-y-auto text-xs">
              {imgCol && record[imgCol.id] && (
                <img 
                  src={record[imgCol.id]} 
                  alt="Detail" 
                  className="w-full h-48 object-cover rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100" 
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
              )}

              <div className="space-y-3">
                {table.columns.map(col => (
                  <div key={col.id} className="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-700/80 flex items-center justify-between">
                    <span className="font-semibold text-slate-500 dark:text-slate-400">{col.label}:</span>
                    <span className="font-bold text-slate-800 dark:text-white">
                      <CellRenderer col={col} value={record[col.id]} row={record} />
                    </span>
                  </div>
                ))}
              </div>

              <div className="pt-4 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <button
                  onClick={onDelete}
                  className="text-rose-600 dark:text-rose-400 font-semibold hover:underline"
                >
                  <i className="fa-solid fa-trash mr-1"></i> Hapus Entry
                </button>
                <div className="flex gap-2">
                  <button
                    onClick={onClose}
                    className="px-4 py-2 rounded-xl text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-100 dark:hover:bg-slate-700"
                  >
                    Tutup
                  </button>
                  <button
                    onClick={onEdit}
                    className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md"
                  >
                    Edit Data
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- STARTER TEMPLATES MODAL ---
    function TemplateModal({ templates, onClose, onSelect }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-2xl my-8 overflow-hidden flex flex-col">
            
            <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                <i className="fa-solid fa-cubes text-brand-600"></i>
                Starter Database Templates
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="p-6 space-y-4 overflow-y-auto text-xs">
              <p className="text-slate-500">
                Pilih template siap pakai dengan skema kolom & sampel data realistis:
              </p>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {templates.map(tpl => (
                  <div key={tpl.id} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 flex flex-col justify-between space-y-3">
                    <div>
                      <div className="flex items-center gap-2 mb-2">
                        <i className={`fa-solid ${tpl.icon} text-lg text-brand-600`}></i>
                        <h4 className="font-bold text-sm text-slate-900 dark:text-white">{tpl.name}</h4>
                      </div>
                      <p className="text-slate-500 dark:text-slate-400 text-xs">{tpl.description}</p>
                    </div>

                    <button
                      onClick={() => onSelect(tpl)}
                      className="w-full py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold transition shadow-sm"
                    >
                      Gunakan Template Ini
                    </button>
                  </div>
                ))}
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- IMPORT / EXPORT MODAL ---
    function ExportImportModal({ tables, activeTable, onClose, onImportTable }) {
      const [tab, setTab] = useState('export'); // 'export' | 'import'
      const [importJson, setImportJson] = useState('');

      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tables, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `databaseku_backup_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleExportCSV = () => {
        if (!activeTable) return;
        const headers = activeTable.columns.map(c => c.label).join(',');
        const rows = activeTable.rows.map(r => 
          activeTable.columns.map(c => `"${String(r[c.id] || '').replace(/"/g, '""')}"`).join(',')
        ).join('\n');
        
        const csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent(`${headers}\n${rows}`);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", csvContent);
        downloadAnchor.setAttribute("download", `${activeTable.id}_export.csv`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportSubmit = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(importJson);
          if (Array.isArray(parsed)) {
            parsed.forEach(t => onImportTable(t));
          } else if (parsed.name && parsed.columns) {
            onImportTable(parsed);
          } else {
            alert('Format JSON tidak valid!');
          }
          onClose();
        } catch (err) {
          alert('JSON tidak dapat dibaca: ' + err.message);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-lg my-8 overflow-hidden flex flex-col">
            
            <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <div className="flex gap-2">
                <button
                  onClick={() => setTab('export')}
                  className={`font-bold text-sm px-3 py-1 rounded-lg ${tab === 'export' ? 'bg-brand-50 text-brand-600 dark:bg-brand-950 dark:text-brand-300' : 'text-slate-400'}`}
                >
                  Export Data
                </button>
                <button
                  onClick={() => setTab('import')}
                  className={`font-bold text-sm px-3 py-1 rounded-lg ${tab === 'import' ? 'bg-brand-50 text-brand-600 dark:bg-brand-950 dark:text-brand-300' : 'text-slate-400'}`}
                >
                  Import JSON
                </button>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="p-6 space-y-4 overflow-y-auto text-xs">
              {tab === 'export' ? (
                <div className="space-y-4">
                  <div className="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-2xl border border-slate-200 dark:border-slate-600 space-y-2">
                    <h4 className="font-bold text-slate-800 dark:text-white">Export Seluruh Database (JSON)</h4>
                    <p className="text-slate-500">Unduh seluruh tabel dan data dalam satu file JSON backup.</p>
                    <button
                      onClick={handleExportJSON}
                      className="w-full py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold"
                    >
                      <i className="fa-solid fa-download mr-1.5"></i> Download JSON Backup
                    </button>
                  </div>

                  {activeTable && (
                    <div className="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-2xl border border-slate-200 dark:border-slate-600 space-y-2">
                      <h4 className="font-bold text-slate-800 dark:text-white">Export Tabel Aktif ("{activeTable.name}") (CSV)</h4>
                      <p className="text-slate-500">Unduh data tabel aktif ke format spreadsheet Excel/CSV.</p>
                      <button
                        onClick={handleExportCSV}
                        className="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold"
                      >
                        <i className="fa-solid fa-file-csv mr-1.5"></i> Download File CSV
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <form onSubmit={handleImportSubmit} className="space-y-3">
                  <label className="font-bold text-slate-700 dark:text-slate-300">Tempelkan Struktur JSON Tabel:</label>
                  <textarea
                    rows={8}
                    value={importJson}
                    onChange={(e) => setImportJson(e.target.value)}
                    placeholder='{"name": "Tabel Baru", "columns": [...], "rows": [...]}'
                    className="w-full p-3 font-mono text-[11px] rounded-xl bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600"
                  ></textarea>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={onClose}
                      className="px-4 py-2 rounded-xl text-slate-600 font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md"
                    >
                      Import Sekarang
                    </button>
                  </div>
                </form>
              )}
            </div>

          </div>
        </div>
      );
    }

    // --- MOUNT REACT APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
