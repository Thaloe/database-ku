  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- STARTER TEMPLATES & DEFAULT DATA ---
    const STARTER_TEMPLATES = [
      {
        id: 'kontak_relasi',

          { id: 'tanggal_kontak', label: 'Tanggal Kontak', type: 'Tanggal', required: false },
          { id: 'foto', label: 'Foto Avatar URL', type: 'URL Gambar', required: false }
        ],
        rows: [
          { id: 'row-1', nama: 'Budi Santoso', email: 'budi@techindo.co.id', telepon: '081234567890', kategori: 'Klien', status: 'Aktif', tanggal_kontak: '2026-10-15', foto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150' },
          { id: 'row-2', nama: 'Siti Rahma', email: 'siti@vendorjaya.com', telepon: '081987654321', kategori: 'Vendor', status: 'Aktif', tanggal_kontak: '2026-10-20', foto: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
          { id: 'row-3', nama: 'Ahmad Rizki', email: 'ahmad@databaseku.id', telepon: '085611223344', kategori: 'Tim', status: 'Aktif', tanggal_kontak: '2026-10-01', foto: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
          { id: 'row-4', nama: 'Dewi Lestari', email: 'dewi@megahcorp.com', telepon: '087799887766', kategori: 'Klien', status: 'Prospek', tanggal_kontak: '2026-10-24', foto: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150' }
        ]
      },
      {
        id: 'inventaris_barang',
        name: 'Inventaris Barang',
        icon: 'fa-boxes-stacked',
        description: 'Pencatatan stok produk, SKU, dan harga satuan.',
        columns: [
          { id: 'nama_produk', label: 'Nama Produk', type: 'Teks', required: true },
          { id: 'sku', label: 'Kode SKU', type: 'Teks', required: true },
          { id: 'kategori', label: 'Kategori Produk', type: 'Pilihan', options: ['Elektronik', 'Aksesoris', 'Mebel', 'Pakaian'], required: true },
          { id: 'stok', label: 'Jumlah Stok', type: 'Angka', required: true },
          { id: 'harga', label: 'Harga Satuan (Rp)', type: 'Angka', required: true },
          { id: 'status', label: 'Status Stok', type: 'Status', options: ['Tersedia', 'Penjualan Tinggi', 'Habis', 'Menunggu Stok'], required: true },
          { id: 'gambar', label: 'Foto Produk URL', type: 'URL Gambar', required: false }
        ],
        rows: [
          { id: 'inv-1', nama_produk: 'Laptop Pro 14 Inch', sku: 'SK-LTP-001', kategori: 'Elektronik', stok: 24, harga: 18500000, status: 'Penjualan Tinggi', gambar: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=200' },
          { id: 'inv-2', nama_produk: 'Mouse Wireless Ergonomis', sku: 'SK-MSE-012', kategori: 'Aksesoris', stok: 85, harga: 350000, status: 'Tersedia', gambar: 'https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=200' },
          { id: 'inv-3', nama_produk: 'Keyboard Mekanikal RGB', sku: 'SK-KBD-009', kategori: 'Aksesoris', stok: 0, harga: 1200000, status: 'Habis', gambar: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=200' },
          { id: 'inv-4', nama_produk: 'Monitor Curved 27 Inch', sku: 'SK-MNT-004', kategori: 'Elektronik', stok: 12, harga: 4200000, status: 'Tersedia', gambar: 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=200' }
        ]
      },
      {
        id: 'manajemen_proyek',
        name: 'Manajemen Proyek',
        icon: 'fa-list-check',
        description: 'Pelacakan tugas tim, prioritas, deadline, dan progress.',
        columns: [
          { id: 'judul_tugas', label: 'Judul Tugas', type: 'Teks', required: true },
          { id: 'penanggung_jawab', label: 'Penanggung Jawab', type: 'Teks', required: true },
          { id: 'prioritas', label: 'Prioritas', type: 'Pilihan', options: ['Tinggi', 'Sedang', 'Rendah'], required: true },
          { id: 'deadline', label: 'Tenggat Waktu', type: 'Tanggal', required: false },
          { id: 'status', label: 'Status Progress', type: 'Status', options: ['Belum Mulai', 'Berjalan', 'Review', 'Selesai'], required: true },
          { id: 'selesai', label: 'Verified Complete', type: 'Checklist', required: false }
        ],
        rows: [
          { id: 'task-1', judul_tugas: 'Redesign Landing Page DatabaseKu', penanggung_jawab: 'Ahmad Rizki', prioritas: 'Tinggi', deadline: '2026-11-05', status: 'Berjalan', selesai: false },
          { id: 'task-2', judul_tugas: 'Integrasi API Payment Gateway', penanggung_jawab: 'Budi Santoso', prioritas: 'Tinggi', deadline: '2026-11-12', status: 'Belum Mulai', selesai: false },
          { id: 'task-3', judul_tugas: 'Testing & Bug Fixing Analytics Module', penanggung_jawab: 'Siti Rahma', prioritas: 'Sedang', deadline: '2026-10-30', status: 'Review', selesai: false },
          { id: 'task-4', judul_tugas: 'Backup Database Server Bulanan', penanggung_jawab: 'Admin System', prioritas: 'Rendah', deadline: '2026-10-25', status: 'Selesai', selesai: true }
        ]
      }
    ];

    // Helper functions for badge colors
    function getBadgeStyle(val) {
      if (!val) return 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
      const str = String(val).toLowerCase();
      if (['aktif', 'tersedia', 'selesai', 'lunas', 'tinggi', 'klien'].includes(str)) {
        return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
      }
      if (['habis', 'nonaktif', 'dibatalkan', 'rendah', 'tunggakan'].includes(str)) {
        return 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300 border border-rose-200 dark:border-rose-800';
      }
      if (['prospek', 'berjalan', 'penjualan tinggi', 'sedang', 'review', 'menunggu stok'].includes(str)) {
        return 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-200 dark:border-amber-800';
      }
      if (['vendor', 'tim', 'mitra', 'elektronik', 'aksesoris', 'belum mulai'].includes(str)) {
        return 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800';
      }
      return 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      // Theme State
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('databaseku_theme') === 'dark' || 
          (!('databaseku_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      });

      // Databases State
      const [tables, setTables] = useState(() => {
        const saved = localStorage.getItem('databaseku_v1_tables');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return STARTER_TEMPLATES;
      });

      // Navigation & Active View State
      const [activeNav, setActiveNav] = useState('tables'); // 'dashboard', 'tables', 'analytics', 'settings'
      const [activeTableId, setActiveTableId] = useState(() => tables[0]?.id || 'kontak_relasi');
      const [viewMode, setViewMode] = useState('table'); // 'table', 'card', 'kanban'
      const [globalSearch, setGlobalSearch] = useState('');
      const [tableSearch, setTableSearch] = useState('');
      
      // Selection & Modals State
      const [selectedRowIds, setSelectedRowIds] = useState([]);
      const [isSchemaModalOpen, setIsSchemaModalOpen] = useState(false);
      const [editingTableSchema, setEditingTableSchema] = useState(null); // null = new table, obj = edit
      const [isRecordModalOpen, setIsRecordModalOpen] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null); // null = new record
      const [detailRecord, setDetailRecord] = useState(null);
      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
      const [isExportImportModalOpen, setIsExportImportModalOpen] = useState(false);
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);

      // Toast Notification System
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Theme Sync
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('databaseku_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('databaseku_theme', 'light');
        }
      }, [darkMode]);

      // Persistence Sync
      useEffect(() => {
        localStorage.setItem('databaseku_v1_tables', JSON.stringify(tables));
      }, [tables]);

      // Active Table Selector safely
      const activeTable = useMemo(() => {
        return tables.find(t => t.id === activeTableId) || tables[0];
      }, [tables, activeTableId]);

      // Ensure activeTableId remains valid if tables change
      useEffect(() => {
        if (!activeTable && tables.length > 0) {
          setActiveTableId(tables[0].id);
        }
      }, [tables, activeTable]);

      // Clear row selection when table changes
      useEffect(() => {
        setSelectedRowIds([]);
        setTableSearch('');
      }, [activeTableId]);

      // CRUD Helpers for Tables
      const handleSaveTableSchema = (schemaData) => {
        if (editingTableSchema) {
          // Update existing schema
          setTables(prev => prev.map(t => t.id === schemaData.id ? { ...t, ...schemaData } : t));
          showToast(`Skema tabel "${schemaData.name}" berhasil diperbarui!`);
        } else {
          // Create new table
          const newTable = {
            ...schemaData,
            id: 'tbl_' + Date.now(),
            rows: []
          };
          setTables(prev => [...prev, newTable]);
          setActiveTableId(newTable.id);
          showToast(`Tabel baru "${schemaData.name}" berhasil dibuat!`);
        }
        setIsSchemaModalOpen(false);
        setEditingTableSchema(null);
      };

      const handleDeleteTable = (tableId) => {
        const tbl = tables.find(t => t.id === tableId);
        if (confirm(`Apakah Anda yakin ingin menghapus seluruh tabel "${tbl?.name}" beserta semua datanya?`)) {
          const filtered = tables.filter(t => t.id !== tableId);
          setTables(filtered);
          if (filtered.length > 0) {
            setActiveTableId(filtered[0].id);
          }
          showToast(`Tabel "${tbl?.name}" telah dihapus.`, 'warning');
        }
      };

      // CRUD Helpers for Records
      const handleSaveRecord = (recordData) => {
        if (!activeTable) return;
        setTables(prev => prev.map(t => {
          if (t.id === activeTable.id) {
            if (editingRecord) {
              // Update
              const updatedRows = t.rows.map(r => r.id === recordData.id ? recordData : r);
              return { ...t, rows: updatedRows };
            } else {
              // Create
              const newRow = { ...recordData, id: 'row_' + Date.now() };
              return { ...t, rows: [newRow, ...t.rows] };
            }
          }
          return t;
        }));
        showToast(editingRecord ? 'Data berhasil diperbarui!' : 'Data baru berhasil ditambahkan!');
        setIsRecordModalOpen(false);
        setEditingRecord(null);
      };

      const handleDeleteRecord = (rowId) => {
        if (!activeTable) return;
        setTables(prev => prev.map(t => {
          if (t.id === activeTable.id) {
            return { ...t, rows: t.rows.filter(r => r.id !== rowId) };
          }
          return t;
        }));
        setSelectedRowIds(prev => prev.filter(id => id !== rowId));
        showToast('Entry data dihapus.', 'info');
      };

      const handleBulkDeleteRecords = () => {
        if (selectedRowIds.length === 0 || !activeTable) return;
        if (confirm(`Hapus ${selectedRowIds.length} data terpilih?`)) {
          setTables(prev => prev.map(t => {
            if (t.id === activeTable.id) {
              return { ...t, rows: t.rows.filter(r => !selectedRowIds.includes(r.id)) };
            }
            return t;
          }));
          setSelectedRowIds([]);
          showToast(`${selectedRowIds.length} data terpilih berhasil dihapus.`, 'info');
        }
      };

      const handleResetToDefault = () => {
        if (confirm('Aksi ini akan mengembalikan database ke template awal dan menghapus perubahan Anda. Lanjutkan?')) {
          setTables(STARTER_TEMPLATES);
          setActiveTableId(STARTER_TEMPLATES[0].id);
          localStorage.removeItem('databaseku_v1_tables');
          showToast('Database berhasil di-reset ke data bawaan!', 'info');
        }
      };

      // Load Template
      const handleLoadTemplate = (template) => {
        const existing = tables.find(t => t.id === template.id);
        if (existing) {
          if (!confirm(`Tabel "${template.name}" sudah ada. Timpa dengan template baru?`)) return;
          setTables(prev => prev.map(t => t.id === template.id ? template : t));
        } else {
          setTables(prev => [...prev, template]);
        }
        setActiveTableId(template.id);
        setIsTemplateModalOpen(false);
        showToast(`Template "${template.name}" berhasil ditambahkan!`);
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-white font-medium bg-slate-900 dark:bg-slate-800 border border-slate-700 animate-bounce">
              <i className={`fa-solid ${toast.type === 'warning' ? 'fa-triangle-exclamation text-amber-400' : toast.type === 'info' ? 'fa-circle-info text-sky-400' : 'fa-circle-check text-emerald-400'} text-lg`}></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="h-16 px-4 md:px-6 bg-white dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/80 flex items-center justify-between shrink-0 z-20">
            {/* Left Branding */}
            <div className="flex items-center gap-3">
              <button 
                onClick={() => setMobileSidebarOpen(!mobileSidebarOpen)} 
                className="md:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300"
              >
                <i className="fa-solid fa-bars text-lg"></i>
              </button>
              
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white flex items-center justify-center shadow-md shadow-brand-500/20">
                  <i className="fa-solid fa-database text-lg"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-lg tracking-tight text-slate-900 dark:text-white">DatabaseKu</span>
                    <span className="text-[10px] font-semibold tracking-wide bg-brand-50 text-brand-600 dark:bg-brand-950 dark:text-brand-300 px-2 py-0.5 rounded-full border border-brand-200 dark:border-brand-800">
                      v1.0
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Kelola & Buat Database Anda Tanpa Ribet</p>
                </div>
              </div>
            </div>

            {/* Quick Search */}
            <div className="hidden md:flex items-center relative w-64 lg:w-80">
              <i className="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-sm"></i>
              <input
                type="text"
                value={globalSearch}
                onChange={(e) => setGlobalSearch(e.target.value)}
                placeholder="Cari cepat semua tabel & data..."
                className="w-full pl-9 pr-4 py-1.5 text-sm rounded-lg bg-slate-100 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
              />
              {globalSearch && (
                <button onClick={() => setGlobalSearch('')} className="absolute right-3 text-slate-400 hover:text-slate-600">
                  <i className="fa-solid fa-xmark text-xs"></i>
                </button>
              )}
            </div>

            {/* Action Controls */}
            <div className="flex items-center gap-2 sm:gap-3">
              <button
                onClick={() => { setEditingTableSchema(null); setIsSchemaModalOpen(true); }}
                className="hidden sm:flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shadow-sm"
              >
                <i className="fa-solid fa-plus"></i>
                <span>+ Tabel Baru</span>
              </button>

              <button
                onClick={() => setIsTemplateModalOpen(true)}
                className="flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition"
                title="Starter Templates"
              >
                <i className="fa-solid fa-cubes text-brand-500"></i>
                <span className="hidden sm:inline">Template</span>
              </button>

              <button
                onClick={() => setIsExportImportModalOpen(true)}
                className="flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition"
                title="Import / Export Data"
              >
                <i className="fa-solid fa-file-arrow-up-down text-indigo-500"></i>
                <span className="hidden sm:inline">Import/Export</span>
              </button>

              <button
                onClick={() => setDarkMode(!darkMode)}
                className="w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition"
                title="Toggle Mode Terang/Gelap"
              >
                <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <div className="flex flex-1 overflow-hidden relative">
            
            {/* SIDEBAR NAVIGATION */}
            <aside className={`
              absolute md:static top-0 left-0 bottom-0 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700/80 
              flex flex-col z-30 transition-transform duration-300
              ${mobileSidebarOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full md:translate-x-0'}
            `}>
              
              {/* Main Nav Items */}
              <div className="p-3 space-y-1">
                <button
                  onClick={() => { setActiveNav('dashboard'); setMobileSidebarOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition ${
                    activeNav === 'dashboard' 
                      ? 'bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-300 font-semibold' 
                      : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'
                  }`}
                >
                  <i className="fa-solid fa-chart-line text-sm text-brand-500 w-4"></i>
                  <span>Dashboard Overview</span>
                </button>

                <button
                  onClick={() => { setActiveNav('tables'); setMobileSidebarOpen(false); }}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition ${
                    activeNav === 'tables' 
                      ? 'bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-300 font-semibold' 
                      : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <i className="fa-solid fa-table text-sm text-indigo-500 w-4"></i>
                    <span>Semua Tabel</span>
                  </div>
                  <span className="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full">
                    {tables.length}
                  </span>
                </button>

                <button
                  onClick={() => { setActiveNav('analytics'); setMobileSidebarOpen(false); }}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition ${
                    activeNav === 'analytics'

                showToast(`Data berhasil di-import ke tabel "${newTable.name}"!`);
              }}
            />
          )}

        </div>
      );
